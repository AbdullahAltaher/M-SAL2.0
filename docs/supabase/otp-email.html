<!--
  Supabase Auth "Magic link" email template for M-SAL2.0 (API.md 2.2).
  signInWithOtp sends this template; it shows the 6-digit code instead of a link.
  Subject: رمز الدخول إلى M-SAL2.0
  Apply with PATCH /v1/projects/{ref}/config/auth (mailer_subjects_magic_link,
  mailer_templates_magic_link_content). The free tier refuses template changes
  until a custom SMTP provider is configured (phase 10).
-->
<div dir="rtl" style="font-family:Tahoma,Arial,sans-serif;text-align:right">
<h2>رمز الدخول</h2>
<p>اكتب هذا الرمز في تطبيق M-SAL2.0:</p>
<p style="font-size:28px;font-weight:bold;letter-spacing:6px" dir="ltr">{{ .Token }}</p>
<p>الرمز صالح لمدة 10 دقائق ولمرة واحدة فقط. إذا لم تطلبه، تجاهل هذه الرسالة.</p>
</div>
