# The Angular app on GitHub Pages: https://abdullahaltaher.github.io/M-SAL2.0/
# Only this repository's Pages; M-SAL's own site is never touched (CLAUDE.md rule 15).
# The settings come from the repository's Actions variables (not secrets: they end up in the
# app anyway): MSAL_API_URL, SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Skipped until the variables are set (the first deploy is then started by hand)
    if: vars.MSAL_API_URL != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      MSAL_API_URL: ${{ vars.MSAL_API_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check the settings are there
        run: |
          for v in MSAL_API_URL SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            [ -n "${!v}" ] || { echo "Missing Actions variable $v"; exit 1; }
          done
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
      # Opening /M-SAL2.0/expenses directly: Pages has no such file, so its 404 page is the app
      - run: cp dist/msal2/browser/index.html dist/msal2/browser/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist/msal2/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
