  <style>
    /* The animated start (SCREENS.md section 7). It follows iOS's plain paper launch image, then
       brings the app's two looks together: the Budget's paper ledger in front, the Expenses' blue
       glass card sliding out behind it, a blue tide rising under the paper, then a slow fade into
       the app. Hidden by main.ts once Angular has started. */
    #boot {
      --paper: #F5F2EA; --surface: #FFFCF5; --border: #DED9CD; --green: #38594A; --brass: #B99A5B; --brass-hi: #F3DFAF;
      --blue0: #E3EBF8; --blue1: #F5F8FD; --blob: rgba(110, 160, 245, .38); --accent: #2459C8; --dot: rgba(60, 110, 210, .55);
      --glass: rgba(255, 255, 255, .72); --glass-line: rgba(60, 100, 180, .22); --track: rgba(30, 60, 130, .14);
      --glow: rgba(185, 154, 91, .22);
      position: fixed; inset: 0; z-index: 2000; overflow: hidden; background: var(--paper);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4vh;
      padding-bottom: 12vh; transition: opacity .9s ease, transform .9s cubic-bezier(.4, 0, .2, 1);
    }
    @media (prefers-color-scheme: dark) {
      #boot {
        --paper: #1B1A16; --surface: #242320; --border: #38362F; --green: #8FB4A0; --brass: #C2A66B; --brass-hi: #FFF0C8;
        --blue0: #0B1426; --blue1: #131C33; --blob: rgba(61, 120, 235, .34); --accent: #4D8DF0; --dot: rgba(170, 200, 255, .85);
        --glass: rgba(22, 34, 62, .82); --glass-line: rgba(120, 160, 255, .28); --track: rgba(255, 255, 255, .13);
        --glow: rgba(194, 166, 107, .16);
      }
    }
    #boot.out { opacity: 0; transform: scale(1.06); pointer-events: none; }

    /* the blue tide under the paper, and the glass section's soft lights */
    #boot .b-tide { position: absolute; inset: 0; opacity: 0; transform: translateY(35%);
      background: linear-gradient(172deg, transparent 0%, transparent 34%, var(--blue0) 72%, var(--blue1) 100%);
      animation: b-tide 1.6s .25s cubic-bezier(.3, .7, .2, 1) forwards; }
    #boot .b-blob { position: absolute; width: 120vmax; height: 120vmax; border-radius: 50%; opacity: 0;
      background: radial-gradient(closest-side, var(--blob), transparent 70%); animation: b-blob 2.4s .4s ease-out forwards; }
    #boot .b-blob.l { left: -70vmax; bottom: -70vmax; }
    #boot .b-blob.r { right: -80vmax; bottom: -40vmax; animation-delay: .7s; }
    #boot .b-glow { position: absolute; width: 90vmax; height: 90vmax; left: 50%; top: -55vmax; margin-left: -45vmax; border-radius: 50%;
      background: radial-gradient(closest-side, var(--glow), transparent 70%); opacity: 0; animation: b-fade 1.2s .1s forwards; }
    /* rising sparks: blue from the Expenses, brass from the Budget */
    #boot .b-spark { position: absolute; bottom: -10px; width: 5px; height: 5px; border-radius: 50%; background: var(--dot); opacity: 0;
      animation: b-spark 2.6s ease-out forwards; }
    #boot .b-spark.g { background: var(--brass); }

    #boot .b-art { position: relative; width: min(64vw, 290px); height: auto; overflow: visible; }
    #boot .b-art * { transform-box: fill-box; transform-origin: center; }
    #boot .b-glass { opacity: 0; transform: translate(70px, 12px) rotate(0deg);
      animation: b-slide .85s .55s cubic-bezier(.2, .9, .25, 1.15) forwards; }
    #boot .b-glass-card { fill: var(--glass); stroke: var(--glass-line); stroke-width: 1.5; }
    #boot .b-track { fill: none; stroke: var(--track); stroke-width: 9; }
    #boot .b-arc { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 151; stroke-dashoffset: 151;
      transform: rotate(-90deg); animation: b-arc 1s 1.15s cubic-bezier(.6, 0, .2, 1) forwards; }
    #boot .b-plus { fill: var(--accent); }
    #boot .b-plus-ink { stroke: #fff; stroke-width: 2.4; stroke-linecap: round; }
    #boot .b-front { opacity: 0; animation: b-card .6s cubic-bezier(.2, .8, .2, 1) forwards, b-float 3s 1.2s ease-in-out infinite alternate; }
    #boot .b-card { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
    #boot .b-rule { stroke: var(--green); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 88; stroke-dashoffset: 88;
      animation: b-draw .6s .45s cubic-bezier(.6, 0, .2, 1) forwards; }
    #boot .b-dots { stroke: var(--border); stroke-width: 2; stroke-dasharray: 2 5; opacity: 0; animation: b-fade .35s forwards; }
    #boot .b-dots.d1 { animation-delay: .9s; }
    #boot .b-dots.d2 { animation-delay: 1.05s; }
    #boot .b-cur { font: 700 26px 'IBM Plex Sans Arabic', 'Noto Sans Arabic', sans-serif; opacity: 0;
      animation: b-rise .5s 1.3s cubic-bezier(.2, .8, .2, 1) forwards; }
    #boot .b-name { margin: 0; font: 700 min(7vw, 30px) 'IBM Plex Sans Arabic', sans-serif; opacity: 0;
      background: linear-gradient(90deg, var(--accent), var(--green) 70%); -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: b-rise .6s 1.6s cubic-bezier(.2, .8, .2, 1) forwards; }
    #boot .b-tags { display: flex; gap: 14px; font: 500 min(3.6vw, 14px) 'IBM Plex Sans Arabic', sans-serif; opacity: 0;
      animation: b-rise .6s 1.85s cubic-bezier(.2, .8, .2, 1) forwards; }
    #boot .b-tags span { display: inline-flex; align-items: center; gap: 6px; color: var(--green); }
    #boot .b-tags span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    #boot .b-tags .x { color: var(--accent); }

    @keyframes b-tide { to { opacity: 1; transform: none; } }
    @keyframes b-blob { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
    @keyframes b-fade { to { opacity: 1; } }
    @keyframes b-spark { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: .9; }
      100% { opacity: 0; transform: translate(var(--dx, 10px), -70vh); } }
    @keyframes b-card { from { opacity: 0; transform: scale(.82) translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes b-float { to { transform: translateY(-4px); } }
    @keyframes b-slide { to { opacity: 1; transform: translate(0, 0) rotate(-8deg); } }
    @keyframes b-draw { to { stroke-dashoffset: 0; } }
    @keyframes b-arc { to { stroke-dashoffset: 46; } }
    @keyframes b-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      #boot, #boot * { animation: none !important; transition: none !important; }
      #boot .b-tide, #boot .b-blob, #boot .b-glow, #boot .b-front, #boot .b-dots, #boot .b-cur, #boot .b-name, #boot .b-tags { opacity: 1; transform: none; }
      #boot .b-glass { opacity: 1; transform: rotate(-8deg); }
      #boot .b-rule { stroke-dashoffset: 0; }
      #boot .b-arc { stroke-dashoffset: 46; }
      #boot .b-spark { display: none; }
    }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true">
    <div class="b-glow"></div>
    <div class="b-tide"></div>
    <div class="b-blob l"></div>
    <div class="b-blob r"></div>
    <i class="b-spark" style="left:12%;--dx:14px;animation-delay:.6s"></i>
    <i class="b-spark g" style="left:24%;--dx:-10px;animation-delay:1s"></i>
    <i class="b-spark" style="left:37%;--dx:8px;animation-delay:.8s"></i>
    <i class="b-spark g" style="left:52%;--dx:-16px;animation-delay:1.3s"></i>
    <i class="b-spark" style="left:63%;--dx:12px;animation-delay:.7s"></i>
    <i class="b-spark g" style="left:76%;--dx:-8px;animation-delay:1.1s"></i>
    <i class="b-spark" style="left:88%;--dx:10px;animation-delay:.9s"></i>
    <svg class="b-art" viewBox="0 0 240 190">
      <defs>
        <!-- a gleam passing over "د.إ" -->
        <linearGradient id="b-shine" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="190" y2="0">
          <stop offset="0" style="stop-color: var(--brass)"/>
          <stop offset=".5" style="stop-color: var(--brass-hi)"/>
          <stop offset="1" style="stop-color: var(--brass)"/>
          <animateTransform attributeName="gradientTransform" type="translate" from="-90 0" to="90 0" begin="1.9s" dur="1s" fill="freeze"/>
        </linearGradient>
      </defs>
      <!-- Expenses: the blue glass card, sliding out from behind -->
      <g class="b-glass">
        <rect class="b-glass-card" x="22" y="30" width="122" height="122" rx="18"/>
        <circle class="b-track" cx="83" cy="80" r="24"/>
        <circle class="b-arc" cx="83" cy="80" r="24"/>
        <rect class="b-plus" x="59" y="118" width="48" height="20" rx="10"/>
        <path class="b-plus-ink" d="M83 122.5v11M77.5 128h11"/>
      </g>
      <!-- Budget: the paper ledger page in front -->
      <g class="b-front">
        <rect class="b-card" x="96" y="40" width="122" height="122" rx="14"/>
        <!-- drawn from the right, as Arabic is written -->
        <line class="b-rule" x1="200" y1="76" x2="114" y2="76"/>
        <line class="b-dots d1" x1="114" y1="99" x2="200" y2="99"/>
        <line class="b-dots d2" x1="114" y1="118" x2="200" y2="118"/>
        <text class="b-cur" x="157" y="150" text-anchor="middle" fill="url(#b-shine)">د.إ</text>
      </g>
    </svg>
    <p class="b-name">ميزانية الشهر</p>
    <div class="b-tags" dir="rtl"><span>الميزانية</span><span class="x">المصاريف</span></div>
  </div>
  <app-root></app-root>
</body>
