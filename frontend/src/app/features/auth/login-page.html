<div class="xbg" aria-hidden="true">
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
</div>

<main class="wrap login">
  <!-- The wallet as the logo, floating, a coin dropping in (DESIGN.md D-28) -->
  <header class="brand">
    <app-floating-wallet class="login-wallet" [class.small]="step() === 'code'" />
    @if (step() === 'email') {
      <h1>ميزانية الشهر</h1>
    } @else {
      <h1>اكتب الرمز</h1>
      <p class="hint">{{ sent() ? 'أرسلناه إلى' : 'الرمز المرسل إلى' }} <bdi dir="ltr">{{ masked() }}</bdi></p>
    }
  </header>

  @if (step() === 'email') {
    <form (ngSubmit)="send()">
      <label class="sr" for="email">البريد الإلكتروني</label>
      <input id="email" name="email" class="field" type="email" dir="ltr" autocomplete="email" inputmode="email" required
             placeholder="البريد الإلكتروني" [ngModel]="email()" (ngModelChange)="email.set($event)" [disabled]="busy()">
      <button type="submit" class="g-btn primary" [disabled]="busy() || !email().trim()">أرسل الرمز</button>
      <button type="button" class="link" (click)="haveCode()" [disabled]="busy() || !email().trim()">عندي رمز</button>
    </form>
  } @else {
    <form (ngSubmit)="verify()">
      <!-- Six boxes on top of one real field, so iOS can still fill the code from the email (D-29) -->
      <label class="sr" for="code">الرمز</label>
      <div class="otp" dir="ltr">
        <input id="code" name="code" class="otp-in" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
               [ngModel]="code()" (ngModelChange)="onCode($event)" [disabled]="busy()" (focus)="codeFocus.set(true)" (blur)="codeFocus.set(false)">
        @for (i of boxes; track i) {
          <span class="otp-box" [class.on]="codeFocus() && i === code().length" [class.full]="i < code().length" aria-hidden="true">{{ code()[i] ?? '' }}</span>
        }
      </div>
      <button type="submit" class="g-btn primary" [disabled]="busy() || code().length !== 6">{{ busy() ? 'لحظة…' : 'دخول' }}</button>
      <div class="row">
        <button type="button" class="link" (click)="changeEmail()">تغيير الإيميل</button>
        <span class="dot" aria-hidden="true">·</span>
        <button type="button" class="link" (click)="send()" [disabled]="!canResend()">
          @if (waitSeconds() > 0) {
            إعادة الإرسال بعد <span class="num">{{ waitSeconds() }}</span>
          } @else {
            إعادة الإرسال
          }
        </button>
      </div>
    </form>
  }

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
</main>
