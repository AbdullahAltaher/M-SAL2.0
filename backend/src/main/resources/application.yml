# M-SAL2.0 backend configuration.
# Every value comes from environment variables; the defaults match the local
# Docker database in docker-compose.yml (not secret, see .env.example).
spring:
  application:
    name: msal2
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:msal}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:msal}
    password: ${DB_PASSWORD:msal_local}
    hikari:
      maximum-pool-size: 5

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
