# M-SAL2.0 backend configuration.
# Every value comes from environment variables; the defaults match the local
# Docker database in docker-compose.yml (not secret, see .env.example).
spring:
  application:
    name: msal2
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:msal}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:msal}
    password: ${DB_PASSWORD:msal_local}
    hikari:
      maximum-pool-size: 5
  # The import file limit (SRV-007-E003, API.md SRV-007)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # Flyway alone changes the tables (CLAUDE.md rule 3); Hibernate only validates them
  flyway:
    schemas: msal
    default-schema: msal
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: msal

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Swagger only in the dev profile (application-dev.yml, API.md section 1)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    level: "%5p [%X{service:-}] [user=%X{user:-}] [req=%X{requestId:-}]"

msal:
  # Not secret: the project URL is public (PLAN.md section 2)
  supabase-url: ${SUPABASE_URL:https://bzdzveckpxmmdoqcfewv.supabase.co}
  # Secret: only from the environment (CLAUDE.md rule 16)
  supabase-secret-key: ${SUPABASE_SECRET_KEY:}
  # The first sign-in with this email, while no user exists, becomes ADMIN (API.md 2.5)
  bootstrap-admin-email: ${MSAL_BOOTSTRAP_ADMIN_EMAIL:}
  rate-limit:
    per-minute: 120
    strict-per-minute: 10
  # The daily reminder (SCREENS.md section 7). VAPID keys are secret: only from the environment
  # (CLAUDE.md rule 16); without them no notification is sent. Made by scripts/generate-vapid-keys.mjs
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:noreply@m-sal2.invalid}
  cors-origins:
    - http://localhost:4200
    - https://abdullahaltaher.github.io
